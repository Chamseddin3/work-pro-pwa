<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><title>Work Pro</title><style>body{font:16px system-ui;background:#eef4f5;color:#123;margin:0}main{max-width:900px;margin:auto;padding:16px}section{background:white;padding:18px;border-radius:16px;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccd;border-radius:8px;box-sizing:border-box}button{background:#0f766e;color:white;cursor:pointer;margin:4px}label{display:flex;flex-direction:column;gap:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:center}.scroll{overflow:auto}#status{color:#065}small{color:#567}</style><main><h1>Work Pro</h1><p>متابعة العمل والمصاريف</p><button id="install" hidden>تنصيب التطبيق</button><p id="status" role="status"></p><section><h2>الملخص الشهري</h2><label>الشهر<input id="month" type="month"></label><p id="summary"></p><small>صافي الوقت = الزائد − الناقص. الغياب والمصروف مستقلان.</small></section><section><h2>إضافة / تعديل يوم</h2><form id="form"><div class="grid"><label>التاريخ<input id="date" type="date" required></label><label>ساعات زائدة<input id="oh" type="number" min="0" step="1" value="0" required></label><label>دقائق زائدة<input id="om" type="number" min="0" max="59" step="1" value="0" required></label><label>ساعات ناقصة<input id="uh" type="number" min="0" step="1" value="0" required></label><label>دقائق ناقصة<input id="um" type="number" min="0" max="59" step="1" value="0" required></label><label>الغياب<select id="abs"><option value="0">لا يوجد</option><option value="0.5">نصف يوم</option><option value="1">يوم</option></select></label><label>نقاط ماشينة 2<input id="pts" type="number" min="0" step="0.01" value="0" required></label><label>المصروف (دج)<input id="exp" type="number" min="0" step="0.01" value="0" required></label></div><label>ملاحظات<textarea id="note" maxlength="2000"></textarea></label><button>حفظ اليوم</button><button type="reset">تفريغ</button></form></section><section><h2>سجلات الشهر</h2><div class="scroll"><table><thead><tr><th>التاريخ</th><th>صافي الوقت</th><th>غياب</th><th>نقاط</th><th>مصروف</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>الحفظ والاسترجاع</h2><p>البيانات محلية في هذا المتصفح، بلا مزامنة. احتفظ بنسخة JSON خارج الهاتف.</p><button id="backup">تنزيل نسخة JSON</button><label>استيراد نسخة JSON<input type="file" id="import" accept=".json,application/json"></label></section></main><script>'use strict';const $=x=>document.getElementById(x),key='work_pro_pwa_v1',nums=['oh','om','uh','um','abs','pts','exp'];let data=[],promptEvent;function message(t){$('status').textContent=t}function valid(a){return Array.isArray(a)&&a.every(r=>r&&typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&nums.every(k=>typeof r[k]==='number'&&Number.isFinite(r[k])&&r[k]>=0)&&r.om<60&&r.um<60&&[0,.5,1].includes(r.abs)&&(r.note===undefined||typeof r.note==='string'))&&new Set(a.map(r=>r.date)).size===a.length}try{data=JSON.parse(localStorage.getItem(key)||'[]');if(!valid(data))throw Error()}catch(e){data=[];message('تعذر قراءة البيانات القديمة؛ احتفظ بنسخة منها قبل الحفظ.')}function persist(next){try{localStorage.setItem(key,JSON.stringify(next));data=next;render();return true}catch(e){message('تعذر الحفظ. صدّر نسخة احتياطية وتحقق من مساحة التخزين.');return false}}function net(r){return r.oh*60+r.om-r.uh*60-r.um}function time(n){return(n<0?'-':'')+Math.floor(Math.abs(n)/60)+':'+String(Math.abs(n)%60).padStart(2,'0')}function render(){const rs=data.filter(r=>r.date.startsWith($('month').value)).sort((a,b)=>b.date.localeCompare(a.date));$('summary').textContent='السجلات: '+rs.length+' | صافي الوقت: '+time(rs.reduce((s,r)=>s+net(r),0))+' | الغياب: '+rs.reduce((s,r)=>s+r.abs,0)+' | النقاط: '+rs.reduce((s,r)=>s+r.pts,0).toFixed(2)+' | المصروف: '+rs.reduce((s,r)=>s+r.exp,0).toFixed(2)+' دج';$('rows').replaceChildren();for(const r of rs){const tr=document.createElement('tr');for(const v of[r.date,time(net(r)),r.abs,r.pts,r.exp]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td');for(const title of['تعديل','حذف']){const b=document.createElement('button');b.textContent=title;b.onclick=()=>{if(title==='تعديل'){for(const k of['date',...nums,'note'])$(k).value=r[k]??'';$('form').scrollIntoView({behavior:'smooth'})}else if(confirm('حذف '+r.date+'؟'))persist(data.filter(x=>x.date!==r.date))};td.append(b)}tr.append(td);$('rows').append(tr)}}const now=new Date(),today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');$('date').value=today;$('month').value=today.slice(0,7);$('month').onchange=render;$('form').onsubmit=e=>{e.preventDefault();const r={date:$('date').value,note:$('note').value};for(const k of nums)r[k]=Number($(k).value);if(!valid([r]))return message('راجع القيم المدخلة');if(data.some(x=>x.date===r.date)&&!confirm('تعويض بيانات هذا اليوم؟'))return;if(persist([...data.filter(x=>x.date!==r.date),r]))message('تم الحفظ')};$('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='work-pro-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};$('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const a=JSON.parse(await f.text());if(!valid(a))throw Error();if(confirm('استبدال جميع السجلات بـ '+a.length+' سجل؟ صدّر نسخة قبل الموافقة.'))if(persist(a))message('تم الاستيراد')}catch(err){message('ملف غير متوافق؛ لم تتغير بياناتك')}e.target.value=''};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').hidden=false});$('install').onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null;$('install').hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>message('تعذر تفعيل العمل دون إنترنت'));render();</script></html>
